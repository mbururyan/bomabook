<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BomaBook: farm records and reports for livestock farms.">
  <meta name="theme-color" content="#1f4a33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BomaBook">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>BomaBook</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Green from the first paint, so there's no white flash before the boot screen */
    html, body { margin: 0; height: 100%; background: #1f4a33; }
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: #1f4a33;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity .35s ease;
    }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot svg { width: 132px; height: 132px; }
    #boot .dot { transition: opacity .18s ease, r .18s ease; }
    #boot .name { color: #fff; font-size: 28px; letter-spacing: -.01em; }
    #boot .name b { font-weight: 800; }
    #boot .name span { font-weight: 500; }
  </style>
</head>
<body>
  <div id="boot" aria-label="Loading BomaBook" role="status">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <g id="boot-ring"></g>
      <g transform="translate(32 33) scale(0.62) translate(-33 -32)">
        <path d="M10,30 q-6,-2 -4,-7 q4,-1 2,3" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M42,21 L46,12 L50,21Z" fill="#fff"/>
        <rect x="10" y="22" width="38" height="22" rx="11" fill="#fff"/>
        <circle cx="47" cy="29" r="9" fill="#fff"/>
        <rect x="51" y="25" width="9" height="9" rx="3" fill="#fff"/>
        <rect x="15" y="40" width="6" height="12" rx="2" fill="#fff"/>
        <rect x="38" y="40" width="6" height="12" rx="2" fill="#fff"/>
        <rect id="bar0" x="16" y="34" width="5" height="6" rx="1" fill="#1f4a33"/>
        <rect id="bar1" x="23" y="30" width="5" height="10" rx="1" fill="#1f4a33"/>
        <rect id="bar2" x="30" y="32" width="5" height="8" rx="1" fill="#1f4a33"/>
        <rect id="bar3" x="37" y="27" width="5" height="13" rx="1" fill="#1f4a33"/>
        <circle cx="48" cy="26.5" r="1.5" fill="#1f4a33"/>
        <ellipse cx="54.3" cy="29.5" rx="1" ry="1.6" fill="#1f4a33"/>
        <ellipse cx="57" cy="29.5" rx="1" ry="1.6" fill="#1f4a33"/>
      </g>
    </svg>
    <div class="name"><b>Boma</b><span>Book</span></div>
  </div>

  <script>
    // Boot animation: the boma's posts fill clockwise from 12 o'clock and a bar
    // rises inside the pig at each quarter. It loops until Flutter's first frame.
    (function () {
      var N = 26, GAP = [0, 1, 25], R = 27;           // same geometry as the app icon
      var BAR_H = [6, 10, 8, 13];
      var STEP = 70, HOLD = 380, REST = 200;           // ms per post, pause when full, pause when empty
      var NS = 'http://www.w3.org/2000/svg';
      var ring = document.getElementById('boot-ring');
      var dots = {}, posts = [];

      for (var i = 0; i < N; i++) {
        if (GAP.indexOf(i) !== -1) continue;           // the gap at the bottom is the gate
        var a = i / N * 2 * Math.PI + Math.PI;
        var c = document.createElementNS(NS, 'circle');
        c.setAttribute('class', 'dot');
        c.setAttribute('cx', (32 + R * Math.sin(a)).toFixed(2));
        c.setAttribute('cy', (32 - R * Math.cos(a)).toFixed(2));
        c.setAttribute('r', '2.3');
        c.setAttribute('fill', '#fff');
        ring.appendChild(c);
        dots[i] = c; posts.push(i);
      }
      // Post 13 sits at the top of the ring; posts are numbered clockwise
      var top = posts.indexOf(13);
      var order = posts.slice(top).concat(posts.slice(0, top));
      var M = order.length, CYCLE = M * STEP + HOLD + REST;
      var bars = [0, 1, 2, 3].map(function (k) { return document.getElementById('bar' + k); });

      function ease(x) { x = Math.max(0, Math.min(1, x)); return 1 - Math.pow(1 - x, 3); }
      function draw(lit) {
        order.forEach(function (p, k) {
          var on = k < lit;
          dots[p].setAttribute('opacity', on ? '1' : '.18');
          dots[p].setAttribute('r', on ? '2.6' : '2.3');
        });
        bars.forEach(function (b, k) {
          // Bar k starts rising just before the ring reaches its quarter
          var h = BAR_H[k] * ease((lit - (k + 1) * M / 4 + 3) / 3);
          b.setAttribute('height', h.toFixed(2));
          b.setAttribute('y', (40 - h).toFixed(2));
        });
      }

      var raf = 0;
      // Anyone who has turned animations off in their phone settings gets the finished mark, still
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        draw(M);
      } else {
        var start = performance.now();
        var tick = function (now) {
          var t = (now - start) % CYCLE;
          draw(t > M * STEP + HOLD ? 0 : Math.min(M, Math.floor(t / STEP) + 1));
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
      }

      window.addEventListener('flutter-first-frame', function () {
        var boot = document.getElementById('boot');
        boot.classList.add('gone');
        setTimeout(function () { cancelAnimationFrame(raf); boot.remove(); }, 400);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
